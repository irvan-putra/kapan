name: update events
on:
  schedule:
    - cron: "23 */6 * * *"   # every ~6h; github may delay scheduled runs
  workflow_dispatch:
  push:
    branches: [main]
    paths: [sources.json, scripts/**, .github/workflows/update.yml]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: fetch events and render site
        run: python3 scripts/fetch.py
      - name: commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/events.json site/events.ics site/index.html
          git diff --cached --quiet || git commit -m "refresh events"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
