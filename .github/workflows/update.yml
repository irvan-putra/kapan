name: update events
on:
  schedule:
    - cron: "23 0 1 * *"   # monthly; github may delay scheduled runs
  workflow_dispatch:
  push:
    branches: [main]
    paths: [sources.json, scripts/**, .github/workflows/update.yml]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: fetch events and render site
        run: python3 scripts/fetch.py
      - name: commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/events.json site/events.ics site/films.json site/index.html site/jakarta/index.html site/jogja/index.html
          git diff --cached --quiet || git commit -m "refresh events"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: upload
        with:
          path: site
      - name: Wait for this attempt's Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT: github-pages
        run: |
          python3 - <<'PYCODE'
          import json, os, time, urllib.request
          url = (os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY']
                 + '/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '/artifacts?per_page=100')
          deadline = time.monotonic() + 120
          delay = 1
          while True:
              request = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=15) as response:
                  artifacts = json.load(response)['artifacts']
              matches = [a for a in artifacts if a['name'] == os.environ['EXPECTED_ARTIFACT']
                         and not a['expired']]
              if matches:
                  print('Pages artifact visible, proceeding to deploy')
                  break
              if time.monotonic() > deadline:
                  raise SystemExit('Pages artifact metadata never became visible')
              time.sleep(delay)
              delay = min(delay * 2, 20)
          PYCODE
      - uses: actions/deploy-pages@v4
