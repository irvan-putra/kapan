name: patuh consistency gate

# Family hygiene checks from irvan-putra/patuh for this web project:
# README, LICENSE drift, commit author, naming. Runs on every push.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    uses: irvan-putra/patuh/.github/workflows/release-gate.yml@f1a72e9766d49b3ca7382fa8f3fba08b7fa776fd
    with:
      app: kapan
      published: false
