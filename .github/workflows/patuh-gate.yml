name: patuh consistency gate

# Family hygiene checks from irvan-putra/patuh for this web project:
# README, LICENSE drift, commit author, naming. Runs on every push.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    uses: irvan-putra/patuh/.github/workflows/release-gate.yml@45bf9b340bc27f6bcafbe909204d5a717c072ab1
    with:
      app: kapan
      published: false
