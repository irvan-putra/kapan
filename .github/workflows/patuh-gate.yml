name: patuh consistency gate

# Family hygiene checks from irvan-putra/patuh for this web project:
# README, LICENSE drift, commit author, naming. Runs on every push.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    uses: irvan-putra/patuh/.github/workflows/release-gate.yml@4e07bf7f13cf57ddbfa686908a707821387b9cf9
    with:
      app: kapan
      published: false
