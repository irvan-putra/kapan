name: patuh consistency gate

# Family hygiene checks from irvan-putra/patuh for this web project:
# README, LICENSE drift, commit author, naming. Runs on every push.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    uses: irvan-putra/patuh/.github/workflows/release-gate.yml@6f4b1eec2a8f73348725b7e3698d3e7bca93b890
    with:
      app: kapan
      published: false
